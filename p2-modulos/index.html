<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaféTec - Módulos ES</title>
  <link rel="stylesheet" href="../p1-dom/style.css">
</head>
<body>
  <h1>CaféTec - Pedidos (módulos ES6)</h1>

  <form id="form-pedido">
    <input id="producto" placeholder="Producto">
    <input id="precio" type="number" step="0.10" placeholder="Precio S/">
    <input id="cantidad" type="number" min="0" placeholder="Cantidad">
    <button type="submit">Agregar</button>
  </form>
  <p id="mensaje"></p>

  <select id="filtro">
    <option value="todos">Todos</option>
    <option value="pendiente">Pendientes</option>
    <option value="entregado">Entregados</option>
  </select>

  <ul id="lista-pedidos"></ul>
  <p id="total"></p>

  <script type="module" src="main.js"></script>
</body>
</html>
